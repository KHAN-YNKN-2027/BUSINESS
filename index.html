<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceaser Labels | Print Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14263d;--mute:#5d6b7d;--line:#d9dfe7;--c:#0095b6;--m:#d2336b;--y:#f0b400;--ok:#1b8a5a;--bad:#c62828;--sh:0 1px 2px rgba(20,38,61,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1724;--panel:#16233a;--ink:#e8eef6;--mute:#93a3b8;--line:#28384f;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1724;--panel:#16233a;--ink:#e8eef6;--mute:#93a3b8;--line:#28384f;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",Arial,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:#14263d;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:19px;margin-bottom:4px}
.reg{display:flex;gap:4px;margin:6px 0 22px}.reg i{width:22px;height:6px;border-radius:2px}
.reg i:nth-child(1){background:var(--c)}.reg i:nth-child(2){background:var(--m)}.reg i:nth-child(3){background:var(--y)}.reg i:nth-child(4){background:#fff}
nav button{display:block;width:100%;text-align:start;background:none;border:0;color:#c5d0de;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.08)}nav button.on{background:#fff;color:#14263d;font-weight:600}
nav .sp{height:18px}
main{padding:24px;max-width:1100px;width:100%}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-inline-start:5px solid var(--c)}
.kpi:nth-child(2){border-color:var(--y)}.kpi:nth-child(3){border-color:var(--m)}.kpi:nth-child(4){border-color:var(--ok)}
.kpi b{display:block;font-size:26px;line-height:1.3}.kpi span{color:var(--mute);font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);font-size:13px}tr:hover td{background:rgba(0,149,182,.05)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.btn{background:var(--c);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.d{background:var(--bad)}.btn.s{padding:5px 10px;font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.s-new{background:#e3f2fd;color:#0d47a1}.s-prod{background:#fff3cd;color:#7a5a00}.s-ready{background:#e0f5ea;color:#13633f}.s-done{background:#e6e9ee;color:#46515f}.s-late{background:#fde4e4;color:#a11b1b}
.search{max-width:280px}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:50}
.modal.open{display:flex}.box{background:var(--panel);border-radius:12px;padding:22px;width:100%;max-width:640px}
.mut{color:var(--mute)}.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.res div{background:var(--bg);border-radius:8px;padding:10px 12px}.res b{display:block;font-size:19px}
.inv{background:#fff;color:#111;padding:26px;border-radius:6px}.inv table{min-width:0}.inv th{color:#555}
.empty{padding:26px;text-align:center;color:var(--mute)}
@media(max-width:780px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;padding:12px}.brand,.reg{width:100%;margin:0}nav button{width:auto}nav .sp{display:none}main{padding:14px}}
@media print{body{background:#fff}.noprint{display:none!important}.app{display:none}.modal{position:static;display:none;padding:0;background:none}.modal.print{display:block}.box{max-width:none;padding:0}}
[hidden]{display:none!important}
body.locked .app{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px;box-shadow:var(--sh)}
.acard .reg{margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
<nav>
 <div class="brand">Ceaser Labels</div>
 <div class="reg"><i></i><i></i><i></i><i></i></div>
 <button data-v="dash" class="on">Dashboard</button>
 <button data-v="orders">Orders</button>
 <button data-v="cust">Customers</button>
 <button data-v="price">Price calculator</button>
 <button data-v="users" id="nu" hidden>Users</button>
 <div class="sp"></div>
 <button id="theme">Dark mode</button>
 <button id="bk">Export backup</button>
 <button id="rs">Restore backup</button>
 <div id="who" style="padding:10px 12px 4px;color:#93a3b8;font-size:13px"></div>
 <button id="lo">Log out</button>
</nav>
<main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<input type="file" id="file" accept=".json" hidden>
<div id="auth" hidden></div>
<script>
const TYPES=["Sticker","Acetate","Thermal barcode","Garment tag","Carton label"];
const ST={new:["New","s-new"],prod:["In production","s-prod"],ready:["Ready","s-ready"],done:["Delivered","s-done"]};
const KEY="ceaser_labels_v1";
let S={cust:[],orders:[],seq:1,rates:{"Sticker":0.012,"Acetate":0.02,"Thermal barcode":0.008,"Garment tag":0.015,"Carton label":0.01},setup:150,min:200};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"EGP "+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const num=n=>Number(n).toLocaleString("en-US");
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cname=id=>(S.cust.find(c=>c.id===id)||{name:"-"}).name;
const late=o=>o.status!=="done"&&o.status!=="ready"&&o.due&&o.due<today();
const calc=(type,w,h,q)=>{const unit=Math.max(0,w*h*(S.rates[type]||0));const raw=unit*q+S.setup;return{unit,total:Math.max(raw,S.min)}};
let view="dash",q="",fs="all";

function tag(o){if(late(o))return'<span class="tag s-late">Overdue</span>';const [t,c]=ST[o.status];return`<span class="tag ${c}">${t}</span>`}

function dash(){
 const t=today(),act=S.orders.filter(o=>o.status!=="done");
 const rev=S.orders.reduce((a,o)=>a+o.total,0),paid=S.orders.reduce((a,o)=>a+o.paid,0);
 const dueToday=act.filter(o=>o.due===t),lates=act.filter(late);
 const rows=[...act].sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).slice(0,8);
 return`<h1>Dashboard</h1><p class="sub">Today at a glance</p>
 <div class="kpis"><div class="kpi"><b>${act.length}</b><span>Active orders</span></div>
 <div class="kpi"><b>${dueToday.length}</b><span>Due today</span></div>
 <div class="kpi"><b class="${lates.length?"neg":""}">${lates.length}</b><span>Overdue orders</span></div>
 <div class="kpi"><b>${money(rev-paid)}</b><span>Outstanding balance</span></div></div>
 <div class="panel"><h2>Next deliveries</h2>${rows.length?`<div class="tw"><table><tr><th>No.</th><th>Customer</th><th>Type</th><th>Qty</th><th>Due</th><th>Status</th></tr>${rows.map(o=>`<tr><td>#${o.no}</td><td>${esc(cname(o.cid))}</td><td>${esc(o.type)}</td><td>${num(o.qty)}</td><td>${o.due||"-"}</td><td>${tag(o)}</td></tr>`).join("")}</table></div>`:'<div class="empty">No active orders. Add one from the Orders page.</div>'}</div>
 <div class="panel"><h2>Revenue</h2><div class="res" style="margin:0"><div><span class="mut">Total ordered</span><b>${money(rev)}</b></div><div><span class="mut">Collected</span><b class="pos">${money(paid)}</b></div><div><span class="mut">Customers</span><b>${S.cust.length}</b></div></div></div>`;
}

function orders(){
 let l=S.orders.filter(o=>(fs==="all"||(fs==="late"?late(o):o.status===fs))&&(!q||(cname(o.cid)+o.type+o.no+(o.notes||"")).toLowerCase().includes(q.toLowerCase())));
 l=[...l].sort((a,b)=>b.no-a.no);
 return`<h1>Orders</h1><p class="sub">All print jobs and their status</p>
 <div class="bar noprint"><button class="btn" onclick="orderForm()">+ New order</button>
 <input class="search" placeholder="Search customer or order no." value="${esc(q)}" oninput="q=this.value;go(1)" id="qs">
 <select style="width:auto" onchange="fs=this.value;go()"><option value="all">All statuses</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${fs===k?"selected":""}>${v[0]}</option>`).join("")}<option value="late" ${fs==="late"?"selected":""}>Overdue</option></select></div>
 <div class="panel tw">${l.length?`<table><tr><th>No.</th><th>Customer</th><th>Type</th><th>Size</th><th>Qty</th><th>Total</th><th>Balance</th><th>Due</th><th>Status</th><th></th></tr>${l.map(o=>`<tr><td>#${o.no}</td><td>${esc(cname(o.cid))}</td><td>${esc(o.type)}</td><td>${o.w}×${o.h} cm</td><td>${num(o.qty)}</td><td>${money(o.total)}</td><td class="${o.total-o.paid>0?"neg":"pos"}">${money(o.total-o.paid)}</td><td>${o.due||"-"}</td><td>${tag(o)}</td><td><button class="btn g s" onclick="invoice('${o.id}')">Invoice</button> <button class="btn g s" onclick="orderForm('${o.id}')">Edit</button></td></tr>`).join("")}</table>`:'<div class="empty">No matching orders.</div>'}</div>`;
}

function cust(){
 const l=S.cust.filter(c=>!q||(c.name+c.phone).toLowerCase().includes(q.toLowerCase()));
 return`<h1>Customers</h1><p class="sub">Contacts and account balances</p>
 <div class="bar noprint"><button class="btn" onclick="custForm()">+ New customer</button><input class="search" placeholder="Search name or phone" value="${esc(q)}" oninput="q=this.value;go(1)" id="qs"></div>
 <div class="panel tw">${l.length?`<table><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Total business</th><th>Balance</th><th></th></tr>${l.map(c=>{const os=S.orders.filter(o=>o.cid===c.id),t=os.reduce((a,o)=>a+o.total,0),p=os.reduce((a,o)=>a+o.paid,0);return`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${os.length}</td><td>${money(t)}</td><td class="${t-p>0?"neg":"pos"}">${money(t-p)}</td><td><button class="btn g s" onclick="custForm('${c.id}')">Edit</button></td></tr>`}).join("")}</table>`:'<div class="empty">No customers yet. Add your first one.</div>'}</div>`;
}

function price(){
 return`<h1>Price calculator</h1><p class="sub">Price = width × height × rate per cm² × quantity + machine setup</p>
 <div class="panel"><div class="grid">
 <div><label>Type</label><select id="pt" onchange="pc()">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
 <div><label>Width (cm)</label><input id="pw" type="number" step="0.1" value="5" oninput="pc()"></div>
 <div><label>Height (cm)</label><input id="ph" type="number" step="0.1" value="3" oninput="pc()"></div>
 <div><label>Quantity</label><input id="pq" type="number" value="1000" oninput="pc()"></div></div>
 <div class="res" id="pr"></div></div>
 <div class="panel"><h2>Rate settings</h2><div class="grid">${TYPES.map(t=>`<div><label>${t} (EGP / cm²)</label><input type="number" step="0.001" value="${S.rates[t]}" onchange="S.rates['${t}']=+this.value;save();pc()"></div>`).join("")}
 <div><label>Machine setup (EGP)</label><input type="number" value="${S.setup}" onchange="S.setup=+this.value;save();pc()"></div>
 <div><label>Minimum order (EGP)</label><input type="number" value="${S.min}" onchange="S.min=+this.value;save();pc()"></div></div>
 <p class="mut" style="margin-bottom:0">Default rates are placeholders. Replace them with your real prices.</p></div>`;
}
function pc(){const e=$("#pr");if(!e)return;const t=$("#pt").value,w=+$("#pw").value||0,h=+$("#ph").value||0,n=+$("#pq").value||0,r=calc(t,w,h,n);
 e.innerHTML=`<div><span class="mut">Unit price</span><b>EGP ${r.unit.toFixed(3)}</b></div><div><span class="mut">Total</span><b>${money(r.total)}</b></div><div><span class="mut">Per 1,000</span><b>${money(n?r.total/n*1000:0)}</b></div>`}

function render(){
 $("#main").innerHTML={dash,orders,cust,price,users}[view]();
 document.querySelectorAll("nav [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 if(view==="price")pc();
}
function go(keepFocus){render();if(keepFocus){const i=$("#qs");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
function open(h,cls){$("#box").innerHTML=h;$("#modal").className="modal open"+(cls?" "+cls:"")}
function close(){$("#modal").className="modal"}

function custForm(id){
 const c=S.cust.find(x=>x.id===id)||{name:"",phone:""};
 open(`<h2>${id?"Edit customer":"New customer"}</h2><div class="grid"><div><label>Name</label><input id="cn" value="${esc(c.name)}"></div><div><label>Phone</label><input id="cp" value="${esc(c.phone)}"></div></div>
 <div class="bar" style="margin:16px 0 0"><button class="btn" onclick="custSave('${id||""}')">Save customer</button><button class="btn g" onclick="close()">Cancel</button>${id&&isAdmin()?`<button class="btn d" style="margin-inline-start:auto" onclick="custDel('${id}')">Delete</button>`:""}</div>`);
}
function custSave(id){const n=$("#cn").value.trim();if(!n){$("#cn").focus();return}
 if(id){const c=S.cust.find(x=>x.id===id);c.name=n;c.phone=$("#cp").value.trim()}else S.cust.push({id:uid(),name:n,phone:$("#cp").value.trim()});
 save();close();render()}
function custDel(id){if(S.orders.some(o=>o.cid===id)){alert("This customer has orders and can't be deleted.");return}if(confirm("Delete this customer?")){S.cust=S.cust.filter(c=>c.id!==id);save();close();render()}}

function orderForm(id){
 if(!S.cust.length){alert("Add a customer first from the Customers page.");return}
 const o=S.orders.find(x=>x.id===id)||{cid:S.cust[0].id,type:TYPES[0],w:5,h:3,qty:1000,total:0,paid:0,status:"new",due:"",notes:""};
 open(`<h2>${id?"Edit order #"+o.no:"New order"}</h2><div class="grid">
 <div><label>Customer</label><select id="oc">${S.cust.map(c=>`<option value="${c.id}" ${c.id===o.cid?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
 <div><label>Type</label><select id="ot" onchange="oAuto()">${TYPES.map(t=>`<option ${t===o.type?"selected":""}>${t}</option>`).join("")}</select></div>
 <div><label>Width (cm)</label><input id="ow" type="number" step="0.1" value="${o.w}" oninput="oAuto()"></div>
 <div><label>Height (cm)</label><input id="oh" type="number" step="0.1" value="${o.h}" oninput="oAuto()"></div>
 <div><label>Quantity</label><input id="oq" type="number" value="${o.qty}" oninput="oAuto()"></div>
 <div><label>Total (EGP)</label><input id="ot2" type="number" step="0.01" value="${o.total||""}"></div>
 <div><label>Paid (EGP)</label><input id="op" type="number" step="0.01" value="${o.paid}"></div>
 <div><label>Due date</label><input id="od" type="date" value="${o.due}"></div>
 <div><label>Status</label><select id="os">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
 <div style="margin-top:12px"><label>Notes (material, colors, job name)</label><textarea id="on" rows="2">${esc(o.notes)}</textarea></div>
 <div class="bar" style="margin:16px 0 0"><button class="btn" onclick="orderSave('${id||""}')">Save order</button><button class="btn g" onclick="close()">Cancel</button>${id&&isAdmin()?`<button class="btn d" style="margin-inline-start:auto" onclick="orderDel('${id}')">Delete</button>`:""}</div>`);
 if(!id)oAuto();
}
function oAuto(){const r=calc($("#ot").value,+$("#ow").value||0,+$("#oh").value||0,+$("#oq").value||0);$("#ot2").value=Math.round(r.total*100)/100}
function orderSave(id){
 const d={cid:$("#oc").value,type:$("#ot").value,w:+$("#ow").value||0,h:+$("#oh").value||0,qty:+$("#oq").value||0,total:+$("#ot2").value||0,paid:+$("#op").value||0,due:$("#od").value,status:$("#os").value,notes:$("#on").value.trim()};
 if(d.qty<=0){$("#oq").focus();return}
 if(id)Object.assign(S.orders.find(x=>x.id===id),d);else S.orders.push(Object.assign({id:uid(),no:S.seq++,date:today()},d));
 save();close();render()}
function orderDel(id){if(confirm("Delete this order?")){S.orders=S.orders.filter(o=>o.id!==id);save();close();render()}}

function invoice(id){
 const o=S.orders.find(x=>x.id===id),c=S.cust.find(x=>x.id===o.cid)||{name:"-",phone:""};
 open(`<div class="inv"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">Ceaser Labels</h2><div>El Quds School St, Third Al Montazah, Alexandria</div><div>010 04412327</div></div><div><b>Invoice #${o.no}</b><div>Date: ${o.date}</div></div></div><hr>
 <p><b>Customer:</b> ${esc(c.name)} ${c.phone?" - "+esc(c.phone):""}</p>
 <table><tr><th>Item</th><th>Size</th><th>Qty</th><th>Unit price</th><th>Total</th></tr><tr><td>${esc(o.type)}${o.notes?"<br><small>"+esc(o.notes)+"</small>":""}</td><td>${o.w}×${o.h} cm</td><td>${num(o.qty)}</td><td>${(o.total/o.qty).toFixed(3)}</td><td>${money(o.total)}</td></tr></table>
 <p style="text-align:right;margin-top:14px">Paid: <b>${money(o.paid)}</b><br>Balance due: <b>${money(o.total-o.paid)}</b></p>
 ${o.due?`<p>Delivery date: ${o.due}</p>`:""}</div>
 <div class="bar noprint" style="margin:14px 0 0"><button class="btn" onclick="window.print()">Print</button><button class="btn g" onclick="close()">Close</button></div>`,"print");
}

document.querySelectorAll("nav [data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;q="";fs="all";render()});
$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
$("#bk").onclick=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="ceaser-labels-"+today()+".json";a.click()};
$("#rs").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.orders)||!Array.isArray(d.cust))throw 0;S=Object.assign(S,d);save();render()}catch(x){alert("This file is not a valid backup.")}};r.readAsText(f);e.target.value=""};

/* ---------- Authentication ---------- */
const UK="ceaser_users_v1",UOK=/^[a-z0-9._-]{3,30}$/;
let U=[];try{U=JSON.parse(localStorage.getItem(UK)||"[]")}catch(e){}
const saveU=()=>{try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}};
let me=null,fails=0,lockUntil=0;
try{me=sessionStorage.getItem("ceaser_sess")}catch(e){}
const isAdmin=()=>{const u=U.find(x=>x.u===me);return !!u&&u.role==="admin"};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function hp(p,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256))}
function authScreen(){
 document.body.classList.add("locked");
 const first=!U.length;
 $("#auth").innerHTML=`<div class="acard"><div class="brand">Ceaser Labels</div><div class="reg"><i></i><i></i><i></i><i></i></div>
 <h2>${first?"Create admin account":"Sign in"}</h2><p class="mut" style="margin-top:0">${first?"First launch: choose the admin username and password.":"Enter your credentials to continue."}</p>
 <label>Username</label><input id="au" autocomplete="username" autocapitalize="none">
 <label style="margin-top:10px">Password</label><input id="ap" type="password" autocomplete="${first?"new-password":"current-password"}">
 ${first?'<label style="margin-top:10px">Confirm password</label><input id="ac" type="password" autocomplete="new-password">':""}
 <div class="neg" id="ae" style="min-height:24px;margin:8px 0"></div>
 <button class="btn" style="width:100%" id="ago">${first?"Create account":"Sign in"}</button></div>`;
 $("#auth").hidden=false;
 $("#ago").onclick=()=>doAuth(first);
 $("#auth").onkeydown=e=>{if(e.key==="Enter")doAuth(first)};
 $("#au").focus();
}
async function doAuth(first){
 const u=$("#au").value.trim().toLowerCase(),p=$("#ap").value,e=$("#ae");
 if(!hasCrypto()){e.textContent="Secure crypto is unavailable. Open this file over https or localhost.";return}
 if(first){
  if(!UOK.test(u)){e.textContent="Username: 3-30 letters, numbers, dot, dash or underscore.";return}
  if(p.length<8){e.textContent="Password must be at least 8 characters.";return}
  if(p!==$("#ac").value){e.textContent="Passwords do not match.";return}
  const salt=newSalt();U.push({u,salt,hash:await hp(p,salt),role:"admin"});saveU();return enter(u);
 }
 if(Date.now()<lockUntil){e.textContent="Too many attempts. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+"s.";return}
 const rec=U.find(x=>x.u===u);
 const ok=rec&&(await hp(p,rec.salt))===rec.hash;
 if(!ok){if(++fails>=5){fails=0;lockUntil=Date.now()+30000}e.textContent="Wrong username or password.";return}
 fails=0;enter(u);
}
function enter(u){me=u;try{sessionStorage.setItem("ceaser_sess",u)}catch(e){}
 $("#auth").hidden=true;$("#auth").innerHTML="";document.body.classList.remove("locked");
 $("#nu").hidden=!isAdmin();$("#rs").hidden=!isAdmin();$("#who").textContent="Signed in: "+u+" ("+(isAdmin()?"admin":"staff")+")";
 view="dash";q="";fs="all";render()}
function logout(){me=null;try{sessionStorage.removeItem("ceaser_sess")}catch(e){}close();authScreen()}
$("#lo").onclick=logout;

function users(){
 if(!isAdmin())return'<div class="empty">Admins only.</div>';
 return`<h1>Users</h1><p class="sub">Manage who can sign in. Staff can't delete records, manage users or restore backups.</p>
 <div class="panel"><h2>Add user</h2><div class="grid"><div><label>Username</label><input id="nu1" autocomplete="off" autocapitalize="none"></div><div><label>Password (min 8)</label><input id="np1" type="password" autocomplete="new-password"></div><div><label>Role</label><select id="nr"><option value="staff">Staff</option><option value="admin">Admin</option></select></div></div>
 <div class="neg" id="ue" style="min-height:24px;margin:8px 0"></div><button class="btn" onclick="userAdd()">Add user</button></div>
 <div class="panel tw"><table><tr><th>Username</th><th>Role</th><th></th></tr>${U.map(x=>`<tr><td>${esc(x.u)}${x.u===me?' <span class="mut">(you)</span>':""}</td><td>${x.role}</td><td><button class="btn g s" onclick="userPw('${x.u}')">Reset password</button> ${x.u!==me?`<button class="btn d s" onclick="userDel('${x.u}')">Delete</button>`:""}</td></tr>`).join("")}</table></div>`;
}
async function userAdd(){
 if(!isAdmin())return;
 const u=$("#nu1").value.trim().toLowerCase(),p=$("#np1").value,e=$("#ue");
 if(!UOK.test(u)){e.textContent="Username: 3-30 letters, numbers, dot, dash or underscore.";return}
 if(U.some(x=>x.u===u)){e.textContent="That username already exists.";return}
 if(p.length<8){e.textContent="Password must be at least 8 characters.";return}
 const salt=newSalt();U.push({u,salt,hash:await hp(p,salt),role:$("#nr").value});saveU();render();
}
async function userPw(u){
 if(!isAdmin())return;
 const p=prompt("New password for "+u+" (min 8 characters):");
 if(p===null)return;if(p.length<8){alert("Password must be at least 8 characters.");return}
 const rec=U.find(x=>x.u===u);rec.salt=newSalt();rec.hash=await hp(p,rec.salt);saveU();alert("Password updated.");
}
function userDel(u){
 if(!isAdmin()||u===me)return;
 if(confirm("Delete user "+u+"?")){U=U.filter(x=>x.u!==u);saveU();render()}
}

if(me&&U.some(x=>x.u===me))enter(me);else authScreen();
</script>
</body>
</html>
